<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>KOI Pokémon VGC Results</title>
  <link rel="icon" type="image/jpeg" href="/koi-logo.jpg">
  <link rel="stylesheet" href="/panel.css">
  <script defer src="/panel.js"></script>
</head>
<body class="entry">
  <main class="sign-in">
    <header>
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <h1>KOI Pokémon VGC Results</h1>
      </div>
      <p>Resultados de Pokémon VGC en OBS.</p>
    </header>
    <form id="login">
      <label for="code">Código de invitación</label>
      <input id="code" name="code" type="password" autocomplete="current-password" minlength="32" maxlength="256" required>
      <div class="inline login-actions"><button type="submit" class="primary">Abrir panel</button></div>
      <p id="login-error" role="status"></p>
    </form>
    <p class="muted details-copy">Proyecto independiente. El panel usa un código privado y las fuentes de OBS tienen enlaces de solo lectura.</p>
  </main>
</body>
</html>
