<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Acceso al panel KOI Pokémon VGC Results con código de invitación.">
  <title>KOI Pokémon VGC Results</title>
  <link rel="icon" type="image/jpeg" href="koi-logo.jpg">
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <main class="sign-in">
    <header>
      <div class="brand">
        <img src="koi-logo.jpg" width="44" height="44" alt="">
        <h1>KOI Pokémon VGC Results</h1>
      </div>
    </header>
    <div class="login">
      <label for="code">Código de invitación</label>
      <input id="code" type="password" aria-describedby="access-status" disabled>
      <button type="button" disabled>Abrir panel</button>
      <p id="access-status">El acceso estará disponible cuando se publique el servidor.</p>
    </div>
    <p class="details">Proyecto independiente.</p>
  </main>
</body>
</html>
